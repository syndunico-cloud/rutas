    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f4f4; color: #222; overflow: hidden; }
        /* position:fixed + inset:0 llena el viewport de forma fiable también en
           navegadores dentro de apps (WhatsApp, Instagram), donde 100vh falla. */
        #container { position: fixed; inset: 0; display: flex; flex-direction: column; }

        #toolbar {
            background: #fff; padding: 8px 14px; border-bottom: 1px solid #d5d5d5;
            display: flex; gap: 14px; align-items: center; flex-wrap: wrap; z-index: 1200;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .toolbar-group { display: flex; gap: 6px; align-items: center; border-right: 1px solid #e0e0e0; padding-right: 14px; }
        .toolbar-group:last-child { border-right: none; }
        .title { font-weight: 700; font-size: 14px; }
        button {
            background: #f0f0f0; color: #222; border: 1px solid #ccc; padding: 6px 11px;
            border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.12s; white-space: nowrap;
        }
        button:hover { background: #e2e8f0; border-color: #94a3b8; }
        button:active { transform: scale(0.97); }
        button.on { background: #0066cc; color: #fff; border-color: #0066cc; }
        .info-text { font-size: 11px; color: #666; font-variant-numeric: tabular-nums; }

        #stage { flex: 1; min-height: 0; display: flex; position: relative; }

        /* ESCRITORIO: el panel es una barra lateral, abierta por defecto.
           Se cierra con la clase .closed. */
        #panel {
            width: 340px; flex-shrink: 0; background: #fff; border-right: 1px solid #d5d5d5;
            display: flex; flex-direction: column; z-index: 700;
            transition: margin-left 0.2s ease, left 0.2s ease;
        }
        #panel.closed { margin-left: -341px; }
        #panel-head { padding: 10px 12px; border-bottom: 1px solid #e5e5e5; display: flex; flex-direction: column; gap: 8px; }
        #panel-head .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        #panel-title { font-weight: 700; font-size: 13px; }
        #btn-close-panel { display: none; background: none; border: none; font-size: 20px; line-height: 1; padding: 0 4px; color: #666; cursor: pointer; }
        #backdrop { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.35); z-index: 650; }
        #panel-sub { font-size: 11px; color: #777; }
        #panel-search { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        #btn-all { font-size: 11px; padding: 3px 8px; }
        #panel-body { flex: 1; overflow-y: auto; padding: 6px 8px 20px; }

        .zona-block { margin-bottom: 4px; border: 1px solid #e5e5e5; border-radius: 6px; overflow: hidden; }
        .zona-block.sel { border-color: #c026d3; box-shadow: 0 0 0 2px rgba(192,38,211,0.15); }
        .zona-hd { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; background: #f7f9fc; font-weight: 700; font-size: 12px; }
        .zona-hd:hover { background: #eef4ff; }
        .zona-hd .cnt { margin-left: auto; font-weight: 500; color: #777; font-size: 11px; }
        .zona-hd .chev { transition: transform 0.15s; color: #999; }
        .zona-block.open .zona-hd .chev { transform: rotate(90deg); }
        .zona-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
        .zona-hd .alias { color: #0066cc; font-weight: 600; font-size: 11px; }
        .zona-items { display: none; }
        .zona-block.open .zona-items { display: block; }

        .ruta { display: flex; gap: 8px; align-items: baseline; padding: 5px 10px 5px 12px; font-size: 12px; border-top: 1px solid #f0f0f0; }
        .ruta[data-ll] { cursor: pointer; }
        .ruta[data-ll]:hover { background: #eef4ff; }
        .ruta:not([data-ll]) { opacity: 0.55; }
        .ruta.active { background: #dbeafe; box-shadow: inset 3px 0 0 #0066cc; }
        .ruta .no { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; color: #fff; background: #94a3b8; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; min-width: 34px; text-align: center; }
        .ruta .nm { flex: 1; }
        .ruta .sub { color: #888; font-size: 11px; }
        .ruta .ok { color: #16a34a; font-weight: 700; }
        .ruta .pin { flex-shrink: 0; font-size: 10px; opacity: 0.5; }
        .ruta .cta {
            flex-shrink: 0; font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 10px; font-weight: 700; color: #166534; background: #dcfce7;
            padding: 1px 6px; border-radius: 3px;
        }
        .ruta[data-ll]:hover .pin { opacity: 1; }
        .no-poly { font-size: 10px; color: #b45309; font-weight: 500; }

        #map { flex: 1; min-height: 0; position: relative; background: #dfe6e9; }

        .legend {
            position: absolute; bottom: 22px; right: 12px; background: rgba(255,255,255,0.95);
            padding: 8px 12px; border-radius: 6px; font-size: 11px; z-index: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .legend div { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
        .legend .sw { width: 14px; height: 3px; }
        .legend .sq { width: 12px; height: 12px; border-radius: 3px; }

        .leaflet-popup-content { font-size: 13px; }
        .leaflet-popup-content strong { display: block; color: #0066cc; margin-bottom: 2px; }

        #splash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #dfe6e9; z-index: 900; font-size: 13px; color: #555; }

        #compass {
            position: absolute; left: 10px; bottom: 20px; width: 54px; height: 54px;
            z-index: 500; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.3)); pointer-events: none;
        }

        /* Botón flotante "Ver lista" (base: oculto; se muestra según contexto abajo) */
        #fab-list {
            display: none; align-items: center; gap: 7px;
            position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px;
            z-index: 680; background: #0066cc; color: #fff; border: none;
            padding: 13px 22px; border-radius: 26px; font-size: 15px; font-weight: 700;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35); cursor: pointer;
        }
        #fab-list:active { transform: translateX(-50%) scale(0.96); }
        /* Escritorio: el FAB solo aparece si el usuario cerró la barra lateral */
        #panel.closed ~ #fab-list { display: flex; }

        /* CELULAR / pantallas angostas: el panel es una capa que ARRANCA CERRADA
           por CSS puro (sin depender del JS). Se abre solo con la clase .open. */
        @media (max-width: 768px) {
            #panel {
                position: fixed; top: 0; bottom: 0; height: auto;
                width: min(88%, 340px); z-index: 700; margin-left: 0;
                left: -110%; box-shadow: 2px 0 16px rgba(0,0,0,0.28);
            }
            #panel.open { left: 0; }
            #fab-list { display: flex; }               /* visible desde el primer frame */
            #panel.open ~ #fab-list { display: none; } /* se esconde al abrir el panel */
            #btn-close-panel { display: block; }
            #backdrop.show { display: block; }
            .legend { display: none; }
            #toolbar { gap: 8px; padding: 6px 10px; }
            .toolbar-group { padding-right: 8px; gap: 4px; }
            .title { font-size: 13px; }
            button { padding: 5px 8px; }
            #coords-info { display: none; }
            #btn-panel { display: none; }
        }
    </style>

    <div id="container">
        <div id="toolbar">
            <div class="toolbar-group"><span class="title">🗺️ Zonas Tizayuca</span></div>

                <button id="btn-zoom-in" title="Acercar">+</button>
                <button id="btn-zoom-out" title="Alejar">−</button>
                <button id="btn-home" title="Ver todo">⤢ Ver todo</button>

            <div class="toolbar-group">
                <button id="btn-base" title="Cambiar mapa base">🛰️ Satélite</button>

                <button id="btn-panel" class="on" title="Mostrar/ocultar lista">📋 Lista</button>

                    </div>
                    <div id="panel-sub"></div>
                    <input id="panel-search" type="text" placeholder="Buscar calle, colonia, fraccionamiento…">
                </div>
                <div id="panel-body"></div>
            </div>

            <div id="backdrop"></div>
            <div id="map">

                        <text x="91" y="55" text-anchor="middle" font-size="12" fill="#475569">E</text>
                        <text x="9" y="55" text-anchor="middle" font-size="12" fill="#475569">O</text>
                    </svg>
                </div>
            </div>

            <div class="legend">
                <div><span class="sq" style="background:#0066cc;opacity:0.3;border:1px solid #0066cc;"></span> Zona (clic para ver su lista)</div>
                <div><span class="sq" style="background:#e8590c;border-radius:50%;"></span> Colonia / punto</div>
                <div><span class="sw" style="background:#111;border-top:2px dashed #111;height:0;"></span> Límite municipal (DWG)</div>
            </div>

            <button id="fab-list" title="Ver la lista de zonas y rutas">📋 Ver lista</button>
        </div>
    </div>

        function whenSized(el, cb) {
            let done = false;
            const run = () => { if (done) return; done = true; try { ro.disconnect(); } catch (e) {} cb(); };
            if (el.clientWidth > 0 && el.clientHeight > 0) { done = true; cb(); return; }
            const ro = new ResizeObserver(() => { if (el.clientWidth > 0 && el.clientHeight > 0) run(); });
            ro.observe(el);
            window.addEventListener('load', () => { if (el.clientWidth > 0 && el.clientHeight > 0) run(); });
            // Fallback duro por si el webview no dispara ResizeObserver/load a tiempo.
            setTimeout(run, 1200);
        }

        function initMap() {
            // Vista inicial explícita sobre Tizayuca: garantiza que el mapa siempre
            // pinta algo aunque el ajuste automático tarde o falle.
            const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([19.858, -98.955], 12);

            const baseLayers = {
                calles: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri', maxZoom: 19 }),
                satelite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri, Maxar', maxZoom: 19 }),
                topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri', maxZoom: 19 })
            };
            const baseOrder = ['calles', 'satelite', 'topo'];
            const baseNames = { calles: '🛰️ Satélite', satelite: '🏔️ Topográfico', topo: '🗺️ Calles' };
            let currentBase = 'calles';
            baseLayers.calles.addTo(map);
            document.getElementById('btn-base').addEventListener('click', () => {
                map.removeLayer(baseLayers[currentBase]);
                currentBase = baseOrder[(baseOrder.indexOf(currentBase) + 1) % baseOrder.length];
                baseLayers[currentBase].addTo(map);
                document.getElementById('btn-base').textContent = baseNames[currentBase];
            });

            // ---- Referencias del DWG (líneas) ----
            const refStyle = {
                municipio: { color: '#111', weight: 2, dashArray: '7 5', fill: false },
                rio:       { color: '#0891b2', weight: 1.4, fill: false, opacity: 0.85 },
                autopista: { color: '#dc2626', weight: 2.2, fill: false, opacity: 0.9 },
                carretera: { color: '#ea580c', weight: 1.3, fill: false, opacity: 0.8 }
            };
            const refsLayer = L.geoJSON(refsData, {
                style: f => refStyle[f.properties.tipo] || { color: '#888', weight: 1 }
            });
            let refsOn = false;
            document.getElementById('btn-refs').addEventListener('click', () => {
                refsOn = !refsOn;
                document.getElementById('btn-refs').classList.toggle('on', refsOn);
                if (refsOn) refsLayer.addTo(map); else map.removeLayer(refsLayer);
            });

            // ---- Zonas + puntos ----
            let dataBounds = L.latLngBounds([]);
            const zonesLayer = L.featureGroup().addTo(map);
            const pointsLayer = L.featureGroup().addTo(map);
            const zonePolys = {};
            let selectedZona = null;

            const zonaAlias = { 5: 'SADASI', 6: 'Haciendas', 8: 'QUMA' };
            const zColor = z => `hsl(${(z * 47) % 360} 70% 45%)`;
            const zonaStyle = (z, sel) => ({
                color: sel ? '#c026d3' : zColor(z),
                weight: sel ? 4 : 2,
                opacity: 0.95,
                fillColor: sel ? '#c026d3' : zColor(z),
                fillOpacity: sel ? 0.25 : 0.12
            });

            let nZonas = 0, nPuntos = 0;
            geojsonData.features.forEach(f => {
                const p = f.properties;
                if (p.tipo === 'zona') {
                    nZonas++;
                    const gj = L.geoJSON(f, { style: zonaStyle(p.zona, false) });
                    gj.eachLayer(l => {
                        l.on('mouseover', () => { if (selectedZona !== p.zona) l.setStyle({ weight: 3.5, fillOpacity: 0.2 }); });
                        l.on('mouseout',  () => { if (selectedZona !== p.zona) l.setStyle(zonaStyle(p.zona, false)); });
                        l.on('click', () => selectZona(p.zona, true));
                    });
                    gj.addTo(zonesLayer);
                    zonePolys[p.zona] = gj;
                    try { dataBounds.extend(gj.getBounds()); } catch (e) {}
                } else {
                    nPuntos++;
                    const c = f.geometry.coordinates;
                    const m = L.circleMarker([c[1], c[0]], { radius: 5, fillColor: '#e8590c', color: '#fff', weight: 1.5, opacity: 1, fillOpacity: 0.9 });
                    m.bindPopup(`<strong>${p.name || '(sin nombre)'}</strong>Zona ${p.zona}`);
                    m.on('click', () => selectZona(p.zona, false));
                    m.addTo(pointsLayer);
                    dataBounds.extend([c[1], c[0]]);
                }
            });

            document.getElementById('count-info').textContent = `${nZonas} zonas · ${nPuntos} colonias`;
            function fitAll() {
                const s = map.getSize();
                if (dataBounds.isValid() && s.x >= 120 && s.y >= 120) {
                    map.fitBounds(dataBounds.pad(0.05), { animate: false });
                }
            }
            fitAll();
            const sp = document.getElementById('splash'); if (sp) sp.remove();

            // ===== PANEL =====
            const panel = document.getElementById('panel');
            const panelBody = document.getElementById('panel-body');
            const panelTitle = document.getElementById('panel-title');
            const panelSub = document.getElementById('panel-sub');
            const searchEl = document.getElementById('panel-search');
            const btnPanel = document.getElementById('btn-panel');

            const zonaNums = Object.keys(zonasLista).map(Number).sort((a, b) => a - b);
            const totalRutas = zonaNums.reduce((s, z) => s + zonasLista[z].length, 0);

            function rutaHTML(r, z, i) {
                const no = `<span class="no">${r.no || '—'}</span>`;
                const ok = r.check ? ' <span class="ok" title="Ruta digitalizada">✓</span>' : '';
                const sub = r.nombre ? ` <span class="sub">· ${r.nombre}</span>` : '';
                const hasLL = Array.isArray(r.ll);
                const attr = hasLL ? ` data-ll="${r.ll[0]},${r.ll[1]}" data-z="${z}" data-i="${i}" title="Ver en el mapa"` : ' title="Sin ubicación en el DWG"';
                const pin = hasLL ? '<span class="pin">📍</span>' : '';
                const cta = typeof r.cuentas === 'number'
                    ? `<span class="cta" title="Cuentas del padrón">${r.cuentas.toLocaleString('es-MX')}</span>` : '';
                return `<div class="ruta"${attr}>${no}<span class="nm">${r.ruta}${sub}${ok}</span>${cta}${pin}</div>`;
            }

            // Total de cuentas de una zona (solo cuenta rutas con dato conocido)
            function zonaTotalCuentas(z) {
                const rutas = zonasLista[z] || [];
                if (!rutas.some(r => typeof r.cuentas === 'number')) return null;
                return rutas.reduce((s, r) => s + (r.cuentas || 0), 0);
            }

            function buildPanel(filter) {
                const f = (filter || '').trim().toLowerCase();
                panelBody.innerHTML = '';
                let shown = 0;
                zonaNums.forEach(z => {
                    let rutas = zonasLista[z];
                    if (f) rutas = rutas.filter(r => r.ruta.toLowerCase().includes(f) || (r.nombre && r.nombre.toLowerCase().includes(f)) || (r.no && r.no.toLowerCase().includes(f)));
                    if (f && rutas.length === 0) return;
                    shown += rutas.length;
                    const hasPoly = !!zonePolys[z];
                    const open = f ? true : (selectedZona === z);
                    const sel = selectedZona === z;
                    const block = document.createElement('div');
                    block.className = 'zona-block' + (open ? ' open' : '') + (sel ? ' sel' : '');
                    block.dataset.z = z;
                    const ztot = zonaTotalCuentas(z);
                    block.innerHTML =
                        `<div class="zona-hd">
                            <span class="zona-dot" style="background:${zColor(z)}"></span>
                            <span>Zona ${z}${zonaAlias[z] ? ` <span class="alias">[${zonaAlias[z]}]</span>` : ''}${ztot !== null ? ` <span class="alias" title="Total de cuentas del padrón">[Total: ${ztot.toLocaleString('es-MX')}]</span>` : ''}</span>
                            ${hasPoly ? '' : '<span class="no-poly">(sin polígono)</span>'}
                            <span class="cnt">${rutas.length} rutas <span class="chev">▶</span></span>
                        </div>
                        <div class="zona-items">${rutas.map((r, i) => rutaHTML(r, z, zonasLista[z].indexOf(r))).join('') || '<div class="ruta"><span class="nm" style="color:#999">Sin coincidencias</span></div>'}</div>`;
                    block.querySelector('.zona-hd').addEventListener('click', () => {
                        if (zonePolys[z]) { selectZona(z, true); closeMobile(); }
                        else { selectedZona = (selectedZona === z ? null : z); refreshStyles(); buildPanel(searchEl.value); }
                    });
                    block.querySelectorAll('.ruta[data-ll]').forEach(el => {
                        el.addEventListener('click', ev => {
                            ev.stopPropagation();
                            const [lon, lat] = el.dataset.ll.split(',').map(Number);
                            const zz = +el.dataset.z, ii = +el.dataset.i;
                            panelBody.querySelectorAll('.ruta.active').forEach(a => a.classList.remove('active'));
                            el.classList.add('active');
                            closeMobile();
                            showRoutePoint(lat, lon, zonasLista[zz][ii], zz);
                        });
                    });
                    panelBody.appendChild(block);
                });
                if (f) { panelTitle.textContent = 'Resultados'; panelSub.textContent = `${shown} coincidencia${shown === 1 ? '' : 's'} para “${filter}”`; }
                else if (selectedZona) {
                    const ztot = zonaTotalCuentas(selectedZona);
                    panelTitle.textContent = `Zona ${selectedZona}${zonaAlias[selectedZona] ? ` [${zonaAlias[selectedZona]}]` : ''}`;
                    panelSub.textContent = `${zonasLista[selectedZona].length} rutas` +
                        (ztot !== null ? ` · ${ztot.toLocaleString('es-MX')} cuentas` : '') +
                        ` · clic en otra zona del mapa para cambiar`;
                }
                else { panelTitle.textContent = 'Todas las zonas'; panelSub.textContent = `${zonaNums.length} zonas · ${totalRutas} rutas en total`; }
                if (selectedZona && !f) { const b = panelBody.querySelector(`.zona-block[data-z="${selectedZona}"]`); if (b) b.scrollIntoView({ block: 'nearest' }); }
            }

            // marca de ruta seleccionada desde el panel
            let routeMarker = null;
            function showRoutePoint(lat, lon, r, z) {
                if (routeMarker) map.removeLayer(routeMarker);
                routeMarker = L.marker([lat, lon], {
                    icon: L.divIcon({
                        className: '',
                        html: '<div style="font-size:26px;line-height:26px;transform:translate(-50%,-100%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">📍</div>',
                        iconSize: [0, 0]
                    }),
                    zIndexOffset: 1000
                }).addTo(map);
                routeMarker.bindPopup(
                    `<strong>${r.ruta}</strong>` +
                    `Ruta ${r.no || '—'} · Zona ${z}${zonaAlias[z] ? ` [${zonaAlias[z]}]` : ''}` +
                    (r.nombre ? `<div style="color:#888">${r.nombre}</div>` : '') +
                    (r.src === 'kml' ? '<div style="color:#b45309;font-size:11px;margin-top:3px">ubicación aproximada (Google Maps)</div>'
                                     : '<div style="color:#16a34a;font-size:11px;margin-top:3px">ubicación del DWG</div>') +
                    '<button class="popup-list-btn" style="margin-top:7px;width:100%;background:#0066cc;color:#fff;border:none;padding:6px;border-radius:4px;font-size:12px;cursor:pointer">📋 Volver a la lista</button>'
                ).openPopup();
                const pb = routeMarker.getPopup().getElement();
                const blb = pb && pb.querySelector('.popup-list-btn');
                if (blb) blb.addEventListener('click', () => { map.closePopup(); togglePanel(true); });
                map.setView([lat, lon], Math.max(map.getZoom(), 15), { animate: true });
            }

            function refreshStyles() {
                Object.entries(zonePolys).forEach(([z, gj]) => gj.setStyle(zonaStyle(Number(z), Number(z) === selectedZona)));
            }
            const backdrop = document.getElementById('backdrop');
            const isMobile = () => window.innerWidth <= 768;

            // Modelo de estado del panel:
            //  - Celular (CSS): cerrado por defecto; se abre con la clase .open.
            //  - Escritorio: abierto por defecto; se cierra con la clase .closed.
            function panelOpen() {
                return isMobile() ? panel.classList.contains('open') : !panel.classList.contains('closed');
            }
            function setPanel(open) {
                if (isMobile()) {
                    panel.classList.toggle('open', open);
                    panel.classList.remove('closed');
                    backdrop.classList.toggle('show', open);
                } else {
                    panel.classList.toggle('closed', !open);
                    panel.classList.remove('open');
                    backdrop.classList.remove('show');
                }
                btnPanel.classList.toggle('on', open && !isMobile());
                setTimeout(() => map.invalidateSize(false), 220);
            }
            function togglePanel(force) { setPanel(force !== undefined ? force : !panelOpen()); }
            function closeMobile() { if (isMobile()) setPanel(false); }

            function selectZona(z, doZoom) {
                selectedZona = z;
                refreshStyles();
                if (!isMobile() && !panelOpen()) setPanel(true);
                searchEl.value = '';
                buildPanel('');
                if (doZoom && zonePolys[z]) map.fitBounds(zonePolys[z].getBounds().pad(0.15), { animate: true });
            }

            btnPanel.addEventListener('click', () => togglePanel());
            document.getElementById('fab-list').addEventListener('click', () => setPanel(true));
            document.getElementById('btn-close-panel').addEventListener('click', () => setPanel(false));
            backdrop.addEventListener('click', () => setPanel(false));

            btnPanel.classList.toggle('on', panelOpen());
            [0, 200, 500, 900, 1600, 2600].forEach(t => setTimeout(() => {
                map.invalidateSize(false);
                if (!selectedZona) fitAll();
            }, t));
            document.getElementById('btn-all').addEventListener('click', () => { selectedZona = null; refreshStyles(); searchEl.value = ''; buildPanel(''); fitAll(); });
            searchEl.addEventListener('input', e => buildPanel(e.target.value));
            document.getElementById('btn-zoom-in').addEventListener('click', () => map.zoomIn());
            document.getElementById('btn-zoom-out').addEventListener('click', () => map.zoomOut());
            document.getElementById('btn-home').addEventListener('click', () => { selectedZona = null; refreshStyles(); fitAll(); });
            map.on('mousemove', e => { document.getElementById('coords-info').textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`; });
            window.addEventListener('resize', () => map.invalidateSize(false));

            // ===== Ubicarme: GPS + ¿en qué zona? =====
            function ptInRing(lng, lat, ring) {
                let inside = false;
                for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
                    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
                }
                return inside;
            }
            function ptInPolygon(lng, lat, geom) {
                const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
                for (const poly of polys) {
                    if (!ptInRing(lng, lat, poly[0])) continue;
                    let inHole = false;
                    for (let k = 1; k < poly.length; k++) if (ptInRing(lng, lat, poly[k])) inHole = true;
                    if (!inHole) return true;
                }
                return false;
            }
            function zonaEnPunto(lng, lat) {
                for (const f of geojsonData.features) {
                    if (f.properties.tipo === 'zona' && ptInPolygon(lng, lat, f.geometry)) return f.properties.zona;
                }
                return null;
            }

            let meLayer = null;
            const btnLoc = document.getElementById('btn-locate');
            btnLoc.addEventListener('click', () => {
                if (!navigator.geolocation) { alert('Este dispositivo no permite geolocalización.'); return; }
                btnLoc.textContent = '⌛ Ubicando…'; btnLoc.disabled = true;
                navigator.geolocation.getCurrentPosition(pos => {
                    btnLoc.textContent = '🧭 Ubicarme'; btnLoc.disabled = false;
                    const lat = pos.coords.latitude, lon = pos.coords.longitude, acc = pos.coords.accuracy || 50;
                    if (meLayer) map.removeLayer(meLayer);
                    meLayer = L.layerGroup([
                        L.circle([lat, lon], { radius: acc, color: '#2563eb', weight: 1, fillColor: '#2563eb', fillOpacity: 0.12 }),
                        L.circleMarker([lat, lon], { radius: 7, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 })
                    ]).addTo(map);
                    const z = zonaEnPunto(lon, lat);
                    const msg = z
                        ? `<strong>Estás en la Zona ${z}${zonaAlias[z] ? ' [' + zonaAlias[z] + ']' : ''}</strong>`
                        : `<strong>Estás fuera de las 10 zonas</strong><div style="color:#888">(la zona más cercana no te contiene)</div>`;
                    meLayer.getLayers()[1].bindPopup(msg + `<div style="color:#888;font-size:11px;margin-top:3px">precisión ±${Math.round(acc)} m</div>`).openPopup();
                    if (z != null) { selectedZona = z; refreshStyles(); buildPanel(''); }
                    map.setView([lat, lon], 15, { animate: true });
                }, err => {
                    btnLoc.textContent = '🧭 Ubicarme'; btnLoc.disabled = false;
                    alert('No se pudo obtener tu ubicación: ' + err.message + '\n(Requiere permiso de ubicación y conexión segura https).');
                }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
            });

            buildPanel('');
        }

        whenSized(document.getElementById('map'), initMap);
    </script>
